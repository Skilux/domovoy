<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DOMOVOY phone</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <svg hidden>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M12 3 2.5 11h2.7v9h5.3v-6h3v6h5.3v-9h2.7z"/></symbol>
  </svg>

  <main class="phone" id="phone" data-screen="ready">
    <section class="screen" data-name="ready">
      <p class="kicker">DOMOVOY phone</p>
      <div class="spacer"></div>
      <button class="pill" id="ready" type="button">Ready</button>
      <p class="note">One click so the ringtone can play</p>
      <div class="spacer"></div>
    </section>

    <section class="screen" data-name="waiting">
      <p class="kicker">DOMOVOY phone</p>
      <div class="spacer"></div>
      <h1>Waiting for a call</h1>
      <div class="dots"><i></i><i></i><i></i></div>
      <div class="spacer"></div>
    </section>

    <section class="screen" data-name="incoming">
      <div class="lcd">
        <p class="lcd-top"><span class="lcd-signal"><i></i><i></i><i></i><i></i></span><span>DOMOVOY NET</span></p>
        <p class="lcd-text"><span id="lcd-text"></span><i class="lcd-cursor"></i></p>
      </div>
      <p class="kicker">Incoming call</p>
      <div class="avatar pulse"><svg><use href="#i-home"/></svg></div>
      <h1>DOMOVOY AI assistant</h1>
      <p class="sub">calling about a flat</p>
      <div class="card">
        <p class="address" data-address></p>
        <p class="sub" data-rent></p>
      </div>
      <div class="spacer"></div>
      <div class="actions">
        <div class="action">
          <button class="round red down" id="decline" type="button" aria-label="Decline"><svg><use href="#i-phone"/></svg></button>
          <span>Decline</span>
        </div>
        <div class="action">
          <button class="round green" id="accept" type="button" aria-label="Accept"><svg><use href="#i-phone"/></svg></button>
          <span>Accept</span>
        </div>
      </div>
    </section>

    <section class="screen" data-name="call">
      <p class="kicker"><span id="call-status">Connecting</span></p>
      <p class="timer" id="timer">00:00</p>
      <p class="sub" data-address></p>
      <div class="wave" id="wave"></div>
      <p class="mode" id="mode"></p>
      <ul class="checklist" id="checklist" hidden></ul>
      <div class="transcript" id="transcript"></div>
      <div class="actions single">
        <div class="action">
          <button class="round red down" id="hangup" type="button" aria-label="Hang up"><svg><use href="#i-phone"/></svg></button>
          <span>Hang up</span>
        </div>
      </div>
    </section>

    <section class="screen" data-name="result">
      <p class="kicker">Call ended</p>
      <div class="badge" id="badge"></div>
      <h1 class="outcome" id="outcome"></h1>
      <div class="cal" id="cal" hidden>
        <p class="cal-month"></p>
        <p class="cal-day"></p>
        <p class="cal-sub"></p>
      </div>
      <div class="card" id="when-card">
        <p class="label">When</p>
        <p class="when" id="when"></p>
      </div>
      <div class="card left">
        <p class="label" data-address></p>
        <p class="summary" id="summary"></p>
      </div>
      <div class="spacer"></div>
    </section>

    <p class="error" id="error" role="alert"></p>
  </main>
  <p class="caption">Live AI voice. No real phone number. Unscripted.</p>

  <audio id="ringtone" src="/ringtone.mp3" loop preload="auto"></audio>
  <script type="module" src="/app.js"></script>
</body>
</html>
