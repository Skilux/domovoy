<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOMOVOY stage rail</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/domovoy.svg">
<style>
html, body { margin: 0; background: #05060b; overflow: hidden; }
.dmv, .dmv * { box-sizing: border-box; }
.dmv p, .dmv h1, .dmv h2, .dmv h3, .dmv ul { margin: 0; padding: 0; }
.dmv { width: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
.dmv-frame { position: relative; margin: 0 auto; overflow: hidden; cursor: pointer; }
.dmv-sheet { display: grid; gap: 18px; padding: 0; }
.dmv-cell { min-width: 0; cursor: pointer; }
.dmv-cap { font: 700 15px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #fff; background: #0a0d18; padding: 7px 12px; border-radius: 8px 8px 0 0; }

.stage {

  transform-origin: 0 0; font-size: 34px; font-weight: 500; line-height: 1.25; color: #fff;
  background:
    radial-gradient(60% 55% at 0% 0%, rgba(92, 70, 200, .35) 0%, rgba(92, 70, 200, 0) 70%),
    radial-gradient(50% 55% at 100% 100%, rgba(16, 120, 110, .3) 0%, rgba(16, 120, 110, 0) 70%),
    #05060b;
}
.stage.is-rail { width: 560px; }
.mono { font-family: ui-monospace, Menlo, Consolas, "Courier New", monospace; }
.kick { font-size: 28px; line-height: 1.2; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: rgba(255, 255, 255, .8); }
.glass { background: rgba(255, 255, 255, .09); border: 1px solid rgba(255, 255, 255, .2); border-radius: 28px; }

.chip { display: inline-flex; align-items: center; flex: none; height: 42px; padding: 0 13px; border-radius: 21px; font-size: 28px; line-height: 1; font-weight: 800; letter-spacing: .04em; white-space: nowrap; }
.chip.BUILT { background: #2fd15a; color: #06250f; }
.chip.PARTLY { background: #ff8a70; color: #2a0c05; }
.chip.PLANNED { border: 2px solid rgba(255, 255, 255, .6); color: rgba(255, 255, 255, .85); }
.tag { display: inline-flex; align-items: center; flex: none; height: 42px; padding: 0 14px; border-radius: 10px; border: 2px dashed rgba(255, 255, 255, .7); font-size: 28px; line-height: 1; font-weight: 800; letter-spacing: .1em; white-space: nowrap; }

.lcd {
  border: 6px solid #10160a; border-radius: 20px; padding: 10px 16px 12px; color: #1f2d12;
  background-color: #a7c957;
  background-image: linear-gradient(rgba(31, 45, 18, .1) 1px, transparent 1px), linear-gradient(90deg, rgba(31, 45, 18, .1) 1px, transparent 1px);
  background-size: 5px 5px;
  box-shadow: inset 0 0 22px rgba(31, 45, 18, .45), 0 0 0 1px rgba(255, 255, 255, .2), 0 10px 28px rgba(0, 0, 0, .35);
  font-family: ui-monospace, Menlo, Consolas, "Courier New", monospace; font-weight: 700; text-align: left;
}
.lcd-top { display: flex; justify-content: space-between; align-items: flex-end; font-size: 28px; line-height: 1.15; letter-spacing: .08em; }
.sig { display: flex; align-items: flex-end; gap: 5px; height: 28px; }
.sig i { width: 8px; background: #1f2d12; }
.sig i:nth-child(1) { height: 25%; } .sig i:nth-child(2) { height: 50%; } .sig i:nth-child(3) { height: 75%; } .sig i:nth-child(4) { height: 100%; }
.lcd-text { font-size: 32px; line-height: 1.25; margin-top: 4px; white-space: nowrap; overflow: hidden; text-shadow: 2px 2px 0 rgba(31, 45, 18, .25); }
.cur { display: inline-block; width: .6em; height: 1em; margin-left: .12em; vertical-align: -.15em; background: currentColor; animation: dmv-blink 1s steps(1) infinite; }
@keyframes dmv-blink { 50% { opacity: 0; } }

.counter { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 28px; font-weight: 700; color: rgba(255, 255, 255, .6); white-space: nowrap; }
.full .counter { position: absolute; right: 44px; bottom: 34px; }

.brand { display: flex; align-items: center; gap: 14px; }
.brand svg { width: 64px; height: 64px; flex: none; display: block; }

.brand .counter { margin-left: auto; align-self: flex-start; }

.rail { position: absolute; top: 0; right: 0; width: 560px; height: 1080px; padding: 20px 24px 20px; display: flex; flex-direction: column; gap: 10px; background: rgba(10, 13, 24, .78); border-left: 1px solid rgba(255, 255, 255, .2); }
.st { display: flex; align-items: center; gap: 10px; height: 56px; flex: none; padding: 0 8px; }
.st .n { width: 44px; height: 44px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #ff8a70; color: #2a0c05; font-size: 28px; line-height: 1; font-weight: 800; }
.st .nm { font-size: 30px; line-height: 1; font-weight: 800; letter-spacing: .1em; }
.st > .chip { margin-left: auto; }
.st.done .n { background: #2fd15a; color: #06250f; }

.st.now { display: block; height: auto; padding: 14px 18px 18px; background: rgba(255, 255, 255, .11); border: 1px solid rgba(255, 255, 255, .28); border-radius: 26px; box-shadow: 0 0 60px rgba(92, 70, 200, .3); }
.st.now .hd { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.st.now .nm { font-size: 40px; }

.ft { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 12px; }
.ft span { font-size: 28px; line-height: 1.2; font-weight: 600; }
.honest { font-size: 28px; line-height: 1.24; font-weight: 600; color: rgba(255, 255, 255, .92); }
.rail .honest { margin-top: auto; padding-top: 12px; border-top: 1px solid rgba(255, 255, 255, .22); }
.rcard { padding: 16px 18px 18px; flex: none; }
.rcard .big { font-size: 34px; line-height: 1.2; font-weight: 700; margin-top: 8px; }
.rcard .lnk { font-size: 28px; line-height: 1.3; font-weight: 700; color: #6fb0ff; margin-top: 6px; overflow-wrap: anywhere; }
.rcard .nx { font-size: 28px; line-height: 1.2; font-weight: 600; }

.zone { position: absolute; left: 24px; top: 20px; width: 1316px; height: 1040px; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; border: 4px dashed rgba(255, 138, 112, .8); border-radius: 30px; }
.ztop { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 52px; flex: none; }
.ph-tag { display: inline-flex; align-items: center; height: 52px; padding: 0 20px; border-radius: 12px; background: #ff8a70; color: #2a0c05; font-size: 32px; line-height: 1; font-weight: 800; white-space: nowrap; }
.zbody { flex: 1; min-height: 0; display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
.zbody.two { grid-template-columns: minmax(0, 1fr) 540px; }
.zbody.book { grid-template-columns: 540px minmax(0, 1fr); }
.stack { display: grid; gap: 20px; grid-template-rows: auto minmax(0, 1fr); min-height: 0; }
.win { display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; border-radius: 20px; border: 1px solid rgba(255, 255, 255, .2); background: rgba(255, 255, 255, .07); }
.win-t { display: flex; align-items: center; gap: 10px; height: 56px; flex: none; padding: 0 20px; background: rgba(255, 255, 255, .1); font-size: 28px; line-height: 1; font-weight: 700; color: rgba(255, 255, 255, .9); white-space: nowrap; }
.win-t i { width: 16px; height: 16px; border-radius: 50%; background: rgba(255, 255, 255, .35); flex: none; }
.win-t i:nth-of-type(3) { margin-right: 8px; }
.win-b { flex: 1; min-height: 0; padding: 20px; display: flex; flex-direction: column; }
.win-b.mid { align-items: center; justify-content: center; padding: 0; }

.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; flex: 1; min-height: 0; }
.col { display: flex; flex-direction: column; gap: 14px; padding: 14px; border-radius: 18px; background: rgba(255, 255, 255, .06); min-width: 0; }
.col-h { display: flex; align-items: center; gap: 10px; font-size: 30px; line-height: 1.2; font-weight: 800; padding: 2px 4px 4px; }
.col-h i { width: 16px; height: 16px; border-radius: 50%; background: rgba(255, 255, 255, .5); flex: none; }
.col-h.int i { background: #6fb0ff; } .col-h.vb i { background: #2fd15a; }
.fcard { padding: 16px 18px 18px; border-radius: 16px; background: rgba(255, 255, 255, .13); border: 1px solid rgba(255, 255, 255, .22); }
.fcard.hot { border: 3px solid #6fb0ff; box-shadow: 0 0 44px rgba(111, 176, 255, .45); }
.fcard.ok { border: 3px solid #2fd15a; box-shadow: 0 0 44px rgba(47, 209, 90, .4); }
.fcard h3 { font-size: 40px; line-height: 1.1; font-weight: 800; letter-spacing: -.01em; }
.fcard .ar { font-size: 28px; line-height: 1.25; color: rgba(255, 255, 255, .8); margin-top: 2px; }
.fcard .mny { font-size: 30px; line-height: 1.25; font-weight: 800; margin-top: 10px; }
.fcard .mny + .mny { margin-top: 2px; }

.fcard .unk + .unk { margin-top: 0; }
.fcard .ans { font-size: 28px; line-height: 1.3; font-weight: 600; margin-top: 8px; }
.fcard .ans + .ans { margin-top: 0; }
.fcard .ans b { color: #7be398; }
.ghost { padding: 18px; border-radius: 16px; border: 2px dashed rgba(255, 255, 255, .22); font-size: 28px; line-height: 1.2; font-weight: 600; color: rgba(255, 255, 255, .4); }
.foot { flex: none; margin-top: 16px; font-size: 30px; line-height: 1.3; font-weight: 600; color: rgba(255, 255, 255, .9); }
.foot b { font-weight: 800; }

.term { background: #090b11; align-items: flex-start; }
.term .ln { font-size: 34px; line-height: 1.3; font-weight: 700; color: #e9ecf5; white-space: nowrap; margin-top: 12px; }
.term .ln em { font-style: normal; color: #2fd15a; margin-right: 14px; }

.ph { position: relative; width: 480px; height: 820px; flex: none; padding: 30px 28px 24px; display: flex; flex-direction: column; align-items: center; text-align: center; overflow: hidden; border-radius: 54px; border: 8px solid #262935; box-shadow: 0 0 0 1px rgba(255, 255, 255, .08), 0 30px 90px rgba(0, 0, 0, .6); }
.ph.incoming { background: radial-gradient(120% 60% at 20% 0%, rgba(30, 150, 90, .7) 0%, rgba(30, 150, 90, 0) 60%), radial-gradient(110% 55% at 100% 100%, rgba(60, 70, 190, .7) 0%, rgba(60, 70, 190, 0) 60%), #0a0d18; }
.ph.call { background: radial-gradient(120% 60% at 15% 0%, rgba(92, 70, 200, .75) 0%, rgba(92, 70, 200, 0) 60%), radial-gradient(110% 55% at 100% 100%, rgba(16, 120, 110, .7) 0%, rgba(16, 120, 110, 0) 60%), #0a0d18; }
.ph.result { background: radial-gradient(120% 60% at 50% 0%, rgba(30, 160, 90, .75) 0%, rgba(30, 160, 90, 0) 62%), #0a0d18; }
.ph .sp { flex: 1; }
.ph .lcd { width: 100%; flex: none; margin-top: 16px; }
.ph .lcd-text { font-size: 40px; }
.ph h3 { font-size: 34px; line-height: 1.15; font-weight: 700; }
.ph .sub { font-size: 28px; line-height: 1.25; font-weight: 600; color: rgba(255, 255, 255, .9); }
.av { width: 84px; height: 84px; flex: none; margin: 30px 0 26px; border-radius: 50%; background: rgba(255, 255, 255, .16); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 11px rgba(255, 255, 255, .07), 0 0 0 24px rgba(255, 255, 255, .04); animation: dmv-pulse 1s ease-in-out infinite; }
.av svg { width: 46%; height: 46%; fill: #fff; }
.pcard { width: 100%; flex: none; margin-top: 16px; padding: 16px 14px; background: rgba(255, 255, 255, .13); border: 1px solid rgba(255, 255, 255, .2); border-radius: 24px; }
.pcard.left { text-align: left; padding: 16px 18px; }
.pcard .addr { font-size: 46px; line-height: 1.15; font-weight: 700; letter-spacing: -.02em; }
.pcard .sum { font-size: 28px; line-height: 1.3; font-weight: 500; margin-top: 4px; }
.acts { width: 100%; flex: none; display: flex; justify-content: space-around; }
.act { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 28px; line-height: 1.2; font-weight: 700; }
.rnd { width: 100px; height: 100px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 26px rgba(0, 0, 0, .35); }
.rnd svg { width: 44%; height: 44%; fill: #fff; }
.rnd.g { background: #2fd15a; } .rnd.r { background: #ff3b30; } .rnd.r svg { transform: rotate(135deg); }
.rnd.sm { width: 84px; height: 84px; }
.timer { font-size: 48px; line-height: 1.1; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 4px; }
.wave { width: 100%; height: 60px; flex: none; display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 12px; color: #2fd15a; }
.wave i { flex: 1; max-width: 9px; height: 100%; border-radius: 5px; background: currentColor; animation: dmv-wave 1.1s ease-in-out infinite; }
.mode { font-size: 28px; line-height: 1.2; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #4fe37a; margin-top: 6px; }
.chk { list-style: none; width: 100%; flex: none; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 12px; }
.chk li { display: flex; align-items: center; gap: 8px; padding: 5px 16px 5px 8px; border-radius: 26px; background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .2); font-size: 28px; line-height: 1.2; font-weight: 700; }
.chk li::before { content: ""; width: 30px; height: 30px; flex: none; border-radius: 50%; border: 3px solid rgba(255, 255, 255, .9); display: flex; align-items: center; justify-content: center; font-size: 24px; line-height: 1; color: #06250f; }
.chk li.done { background: rgba(47, 209, 90, .22); border-color: rgba(47, 209, 90, .7); }
.chk li.done::before { content: "\2713"; background: #2fd15a; border-color: #2fd15a; }
.talk { width: 100%; flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; margin: 10px 0 14px; text-align: left; }
.bub { max-width: 92%; flex: none; }
.bub small { display: block; font-size: 28px; line-height: 1.2; font-weight: 700; color: rgba(255, 255, 255, .85); margin: 0 12px 4px; }
.bub div { font-size: 28px; line-height: 1.25; font-weight: 500; padding: 10px 16px; border-radius: 22px; }
.bub.a { align-self: flex-start; } .bub.a div { background: rgba(255, 255, 255, .2); border-bottom-left-radius: 7px; }
.bub.u { align-self: flex-end; } .bub.u small { text-align: right; } .bub.u div { background: #2563eb; border-bottom-right-radius: 7px; }
.badge { width: 88px; height: 88px; flex: none; position: relative; border-radius: 50%; background: #2fd15a; box-shadow: 0 0 0 12px rgba(47, 209, 90, .22); margin-top: 22px; }
.badge::after { content: ""; position: absolute; left: 50%; top: 45%; width: 26%; height: 46%; border-right: 8px solid #fff; border-bottom: 8px solid #fff; transform: translate(-50%, -50%) rotate(45deg); }
.outcome { font-size: 46px !important; font-weight: 800 !important; margin-top: 26px; }
.cal { width: 236px; flex: none; margin-top: 22px; border-radius: 24px; overflow: hidden; background: #fff; color: #0a0d18; text-align: center; box-shadow: 0 12px 34px rgba(0, 0, 0, .4); }
.cal-m { padding: 8px 0; background: #e5342b; color: #fff; font-size: 28px; line-height: 1.2; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
.cal-d { font-size: 78px; line-height: 1.08; font-weight: 800; }
.cal-s { font-size: 30px; line-height: 1.2; font-weight: 700; padding-bottom: 12px; }

.gcal { display: flex; align-items: center; gap: 26px; }
.gcal .cal { margin-top: 0; width: 200px; }
.gcal h3 { font-size: 40px; line-height: 1.12; font-weight: 800; }
.gcal .wh { font-size: 36px; line-height: 1.25; font-weight: 800; color: #6fb0ff; margin-top: 8px; }
.gcal .ar { font-size: 28px; line-height: 1.3; color: rgba(255, 255, 255, .85); margin-top: 4px; }
.pill-vb { display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px; border-radius: 22px; background: rgba(47, 209, 90, .22); border: 2px solid #2fd15a; font-size: 28px; line-height: 1; font-weight: 800; margin-bottom: 12px; }
.pill-vb i { width: 16px; height: 16px; border-radius: 50%; background: #2fd15a; }

.hog { display: grid; grid-template-columns: minmax(0, 1fr) 44px minmax(0, 1fr) 44px minmax(0, 1fr); align-items: stretch; flex: 1; min-height: 0; }
.hog .arw { align-self: center; text-align: center; font-size: 60px; line-height: 1; font-weight: 800; color: #ff8a70; }
.hcard { padding: 26px 26px 28px; display: flex; flex-direction: column; }
.hcard .num { font-size: 120px; line-height: 1; font-weight: 800; letter-spacing: -.03em; margin-top: 30px; }
.hcard .num.yes { color: #2fd15a; }
.hcard .q { font-size: 60px; line-height: 1.08; font-weight: 800; letter-spacing: -.02em; margin-top: 30px; }
.hcard .ln { font-size: 36px; line-height: 1.25; font-weight: 700; margin-top: 16px; }
.hcard .sm { font-size: 28px; line-height: 1.3; font-weight: 500; color: rgba(255, 255, 255, .85); margin-top: 16px; }
.hcard .xs { display: flex; gap: 14px; margin-top: 26px; }
.hcard .xs i { width: 76px; height: 76px; border-radius: 16px; border: 3px solid #ff3b30; background: rgba(255, 59, 48, .16); position: relative; }
.hcard .xs i::before, .hcard .xs i::after { content: ""; position: absolute; left: 50%; top: 50%; width: 46px; height: 6px; border-radius: 3px; background: #ff3b30; transform: translate(-50%, -50%) rotate(45deg); }
.hcard .xs i::after { transform: translate(-50%, -50%) rotate(-45deg); }
.hcard .tag { margin-top: auto; align-self: flex-start; text-transform: uppercase; }

.full { position: absolute; inset: 0; display: flex; flex-direction: column; }
.title { padding: 64px 110px 34px; }
.tbrand { display: flex; align-items: center; gap: 30px; }
.tbrand .lcd { display: flex; align-items: center; gap: 22px; padding: 14px 26px 14px 16px; border-radius: 24px; }
.tbrand .lcd svg { width: 92px; height: 92px; display: block; }
.tbrand .lcd b { font-size: 68px; line-height: 1; letter-spacing: .14em; }
.tbrand .team { font-size: 36px; font-weight: 600; color: rgba(255, 255, 255, .78); }
.title .kick { margin-top: 36px; font-size: 30px; color: #ff8a70; }
.title h1 { font-size: 90px; line-height: 1.06; font-weight: 800; letter-spacing: -.02em; margin-top: 16px; max-width: 1700px; }
.title h1 span { display: block; color: rgba(255, 255, 255, .86); }
.pitch { margin-top: 30px; padding: 26px 36px 30px; align-self: flex-start; max-width: 1700px; }
.pitch .p1 { font-size: 50px; line-height: 1.15; font-weight: 800; }
.beats { display: flex; gap: 28px; margin-top: 30px; max-width: 1700px; }
.beats div { flex: 1; display: flex; align-items: center; gap: 18px; font-size: 34px; line-height: 1.2; font-weight: 700; }
.beats b { flex: none; width: 60px; height: 60px; border-radius: 50%; background: #ff8a70; color: #2a0c05; font-size: 34px; font-weight: 800; display: flex; align-items: center; justify-content: center; }

.full .honest { margin-top: auto; max-width: 1640px; color: rgba(255, 255, 255, .8); }

.close { padding: 44px 90px 34px; }
.close .brand svg { width: 72px; height: 72px; }
.close .brand { align-items: center; gap: 18px; }
.close .brand b { font-size: 40px; display: inline; }
.close .brand small { font-size: 30px; display: inline; margin-left: 14px; }
.close h1 { font-size: 88px; line-height: 1.05; font-weight: 800; letter-spacing: -.02em; margin-top: 26px; }
.links { display: flex; gap: 28px; margin-top: 28px; }
.link { padding: 16px 30px 20px; }
.link p:last-child { font-size: 44px; line-height: 1.2; font-weight: 700; color: #fff; margin-top: 4px; white-space: nowrap; }
.cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; margin-top: 28px; }
.ccol { padding: 22px 28px 24px; }
.ccol .chip { height: 52px; padding: 0 20px; border-radius: 26px; font-size: 34px; }
.ccol ul { list-style: none; margin-top: 14px; }
.ccol li { font-size: 34px; line-height: 1.38; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.next { display: flex; align-items: center; gap: 20px; margin-top: 44px; font-size: 40px; line-height: 1.2; font-weight: 700; }

@media (prefers-reduced-motion: reduce) {
  .cur, .av, .wave i { animation: none; }
}
</style>
</head>
<body>
<div class="dmv" id="dmv-a"></div>
<script>
(function () {
  "use strict";

  // Every status label lives here. Edit before the demo.
  // chip is one of: BUILT, PARTLY, PLANNED.
  var STATUS = {
    chipText: { BUILT: "BUILT TODAY", PARTLY: "PARTLY", PLANNED: "PLANNED" },
    closeTitles: { BUILT: "BUILT TODAY", PARTLY: "PARTLY", PLANNED: "PLANNED" },
    steps: { find: "BUILT", approve: "BUILT", call: "BUILT", book: "PARTLY", learn: "PARTLY" },
    features: {
      voice:    { label: "Live AI voice call",          chip: "BUILT" },
      skill:    { label: "Call skill, Notion in and out", chip: "BUILT" },
      gate:     { label: "Approval gate",               chip: "BUILT" },
      learn:    { label: "PostHog learning loop",       chip: "PARTLY" },
      listings: { label: "Listings from 3 portals",     chip: "BUILT" },
      costs:    { label: "Honest cost math",            chip: "PARTLY" },
      fees:     { label: "Fee reading from text",       chip: "PARTLY" },
      calendar: { label: "Calendar event",              chip: "PLANNED" },
      flow:     { label: "Whole flow in one piece",     chip: "PLANNED" },
      install:  { label: "One-command install",         chip: "PARTLY" },
      business: { label: "Next: a business edition for real estate agents", chip: "PLANNED" },
      later:    { label: "Real phone calls, Czech", chip: "PLANNED" }
    },
    closeOrder: ["voice", "skill", "gate", "learn", "listings", "costs", "fees", "calendar", "flow", "install", "later"],
    closeMax: 4
  };

  var HONESTY = "Live browser voice call with a demo realtor. No phone network. The real listing agent is never called.";
  var REPO = "github.com/Skilux/domovoy";
  var DEMO = "domovoy-phone.vercel.app/start";

  var STEPS = [
    { id: "find",    name: "FIND",    say: [["listings", "Three portals, one shortlist"], ["costs", "Monthly cost and move-in cost"]] },
    { id: "approve", name: "APPROVE", say: [["gate", "Nobody is contacted before this move"]] },
    { id: "call",    name: "CALL",    say: [["voice", "Live, unscripted AI voice call"]] },
    { id: "book",    name: "BOOK",    say: [["skill", "Notion status and call summary"], ["calendar", "Calendar event"]] },
    { id: "learn",   name: "LEARN",   say: [["learn", "Rejections become one approved rule"]] }
  ];

  var STATES = [
    { name: "Title",           step: -1, lcd: "" },
    { name: "FIND",            step: 0,  lcd: "3 PORTALS > 1 LIST" },
    { name: "APPROVE",         step: 1,  lcd: "MOVED TO INTERESTED" },
    { name: "CALL: incoming",  step: 2,  lcd: "RINGING DEMO REALTOR" },
    { name: "CALL: in call",   step: 2,  lcd: "CALL IS LIVE" },
    { name: "BOOK",            step: 3,  lcd: "VIEWING BOOKED" },
    { name: "LEARN",           step: 4,  lcd: "1 RULE, AFTER A YES" },
    { name: "Close",           step: 5,  lcd: "" }
  ];
  var LAST = STATES.length - 1;

  var MASCOT = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" shape-rendering="crispEdges" aria-hidden="true"><rect width="20" height="20" rx="3" fill="#a7c957"/><path fill="#1f2d12" d="M9 2h2v1h-2zM8 3h4v1h-4zM7 4h2v1h-2zM11 4h2v1h-2zM6 5h3v1h-3zM11 5h3v1h-3zM5 6h10v1h-10zM3 7h14v1h-14zM5 8h1v1h-1zM14 8h1v1h-1zM5 9h1v1h-1zM7 9h2v1h-2zM11 9h2v1h-2zM14 9h1v1h-1zM5 10h1v1h-1zM14 10h1v1h-1zM4 11h3v1h-3zM9 11h2v1h-2zM13 11h3v1h-3zM4 12h12v1h-12zM4 13h12v1h-12zM5 14h10v1h-10zM6 15h8v1h-8zM7 16h6v1h-6zM9 17h2v1h-2z"/><path fill="#ffd23f" d="M9 4h2v1h-2zM9 5h2v1h-2z"/></svg>';
  var I_PHONE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>';
  var I_HOME = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2.5 11h2.7v9h5.3v-6h3v6h5.3v-9h2.7z"/></svg>';
  var SIG = '<span class="sig"><i></i><i></i><i></i><i></i></span>';

  function chip(kind) { return '<span class="chip ' + kind + '">' + STATUS.chipText[kind] + '</span>'; }
  function featureChip(id) { return chip(STATUS.features[id].chip); }
  function counter(n) { return '<span class="counter">' + n + '/' + LAST + '</span>'; }
  function brand(extra) {
    return '<div class="brand">' + MASCOT + '<div><b>DOMOVOY</b><small>by (Not)Homeless.ai</small></div>' + (extra || '') + '</div>';
  }

  /* ---------- rail ---------- */
  function railSteps(n) {
    var cur = STATES[n].step;
    return STEPS.map(function (s, i) {
      if (i === cur) {
        var rows = s.say.map(function (r) {
          return '<div class="ft"><span>' + r[1] + '</span>' + featureChip(r[0]) + '</div>';
        }).join('');
        return '<div class="st now"><div class="hd"><span class="n">' + (i + 1) + '</span><span class="nm">' + s.name + '</span></div>' +
          '<div class="lcd"><p class="lcd-top">' + SIG + '<span>STEP ' + (i + 1) + ' OF 5</span></p>' +
          '<p class="lcd-text">' + STATES[n].lcd + '<i class="cur"></i></p></div>' + rows + '</div>';
      }
      var done = i < cur;
      return '<div class="st ' + (done ? 'done' : 'future') + '"><span class="n">' + (done ? '&#10003;' : (i + 1)) + '</span>' +
        '<span class="nm">' + s.name + '</span>' + chip(STATUS.steps[s.id]) + '</div>';
    }).join('');
  }
  function rail(n) {
    var card = '';
    if (n === 0) {
      card = '<div class="rcard glass"><p class="kick">Vladimir, renter</p>' +
        '<p class="big">Three portals, hidden fees, and calls during work hours.</p></div>';
    }
    if (n === LAST) {
      card = '<div class="rcard glass"><p class="kick">Install the skill</p>' +
        '<p class="lnk">' + REPO + '</p><p class="lnk">' + DEMO + '</p>' +
        '<div class="ft"><span class="nx">' + STATUS.features.business.label + '</span>' + featureChip('business') + '</div></div>';
    }
    return '<div class="rail">' + brand(counter(n)) + (n === 0 ? card : '') + railSteps(n) + (n === LAST ? card : '') +
      '<p class="honest">' + HONESTY + '</p></div>';
  }

  /* ---------- live window stand-ins ---------- */
  function win(title, body, cls) {
    return '<div class="win"><div class="win-t"><i></i><i></i><i></i>' + title + '</div><div class="win-b ' + (cls || '') + '">' + body + '</div></div>';
  }
  function flatCard(kind) {
    if (kind === 'booked') {
      return '<div class="fcard ok"><h3>Korunni 88</h3><p class="ar">Praha 2 - Vinohrady</p>' +
        '<p class="mny">Mon 16 Nov, 17:00</p>' +
        '<p class="ans">Commission: <b>about 30,000 CZK</b></p><p class="ans">Pets: <b>depends on the pets</b></p></div>';
    }
    return '<div class="fcard ' + (kind === 'hot' ? 'hot' : '') + '"><h3>Korunni 88</h3><p class="ar">Praha 2 - Vinohrady</p>' +
      '<p class="mny">Monthly 27,500 CZK</p><p class="mny">Move-in cost 75,500&nbsp;CZK</p>' +
      '<p class="unk">Commission: unknown</p><p class="unk">Pets: unknown</p></div>';
  }
  function board(where, foot) {
    var g = '<div class="ghost">sample flat 2</div><div class="ghost">sample flat 3</div>';
    return win('Notion shortlist (stand-in)',
      '<div class="board">' +
      '<div class="col"><p class="col-h"><i></i>Shortlisted</p>' + (where === 0 ? flatCard('') : '') + g + '</div>' +
      '<div class="col"><p class="col-h int"><i></i>Interested</p>' + (where === 1 ? flatCard('hot') : '') + '</div>' +
      '<div class="col"><p class="col-h vb"><i></i>Viewing booked</p>' + (where === 2 ? flatCard('booked') : '') + '</div>' +
      '</div>' + foot);
  }
  function terminal() {
    return win('Claude Code (stand-in)',
      '<p class="kick">Vladimir types</p><p class="ln mono"><em>&gt;</em>call about my Interested flat<i class="cur"></i></p>', 'term');
  }
  function phone(screen) {
    var inner;
    if (screen === 'incoming') {
      inner = '<p class="kick">Incoming call</p>' +
        '<div class="lcd"><p class="lcd-top">' + SIG + '<span>DOMOVOY NET</span></p><p class="lcd-text">KORUNNI 88<i class="cur"></i></p></div>' +
        '<div class="av">' + I_HOME + '</div><h3>DOMOVOY AI assistant</h3><p class="sub">calling about a flat</p>' +
        '<div class="pcard"><p class="addr">Korunni 88</p><p class="sub">Rent 24,000 CZK</p></div><div class="sp"></div>' +
        '<div class="acts"><div class="act"><span class="rnd r">' + I_PHONE + '</span>Decline</div>' +
        '<div class="act"><span class="rnd g">' + I_PHONE + '</span>Accept</div></div>';
    } else if (screen === 'call') {
      var bars = '';
      var hs = [.3, .55, .8, .45, .95, .6, .35, .75, 1, .5, .85, .4, .65, .9, .35, .7, .5, .8, .3, .6, .9, .45, .7, .35];
      for (var i = 0; i < hs.length; i++) bars += '<i style="animation-delay:-' + (hs[i] * 1.1).toFixed(2) + 's"></i>';
      inner = '<p class="kick">Connected</p><p class="timer">00:42</p>' +
        '<div class="wave">' + bars + '</div><p class="mode">Agent speaking</p>' +
        '<ul class="chk"><li class="done">Viewing</li><li class="done">Commission</li><li>Pets</li></ul>' +
        '<div class="talk"><div class="bub a"><small>DOMOVOY</small><div>Is Monday at 17:00 free for a viewing?</div></div>' +
        '<div class="bub u"><small>Daniel (demo role)</small><div>Yes, Monday works.</div></div></div>' +
        '<div class="acts" style="justify-content:center"><div class="act"><span class="rnd r sm">' + I_PHONE + '</span>Hang up</div></div>';
    } else {
      inner = '<p class="kick">Call ended</p><div class="badge"></div><h3 class="outcome">Viewing booked</h3>' +
        '<div class="cal"><p class="cal-m">Nov</p><p class="cal-d">16</p><p class="cal-s">Mon 17:00</p></div>' +
        '<div class="sp"></div>' +
        '<div class="pcard left"><p class="kick">Korunni 88</p><p class="sum">Commission about 30,000 CZK. Pets: depends on the pets.</p></div>';
    }
    return win('Phone page (stand-in)', '<div class="ph ' + screen + '">' + inner + '</div>', 'mid');
  }
  function calendar() {
    return win('Google Calendar (stand-in)',
      '<div class="gcal"><div class="cal"><p class="cal-m">Nov</p><p class="cal-d">16</p><p class="cal-s">Mon</p></div>' +
      '<div><h3>Viewing: Korunni 88</h3><p class="wh">Mon 16 Nov, 17:00</p><p class="ar">Praha 2 - Vinohrady</p>' +
      '<p class="ar">Inside the free window 17:00-19:00</p></div></div>');
  }
  function notionBooked() {
    return win('Notion shortlist (stand-in)',
      '<div><span class="pill-vb"><i></i>Viewing booked</span></div>' + flatCard('booked') +
      '<p class="foot">Call summary added to the flat page.</p>');
  }
  function posthog() {
    return win('PostHog report (stand-in)',
      '<div class="hog">' +
      '<div class="hcard glass"><p class="kick">Rejection reasons</p><p class="num">3 of 3</p>' +
      '<p class="ln">rejected flats: no elevator</p><div class="xs"><i></i><i></i><i></i></div></div>' +
      '<p class="arw">&gt;</p>' +
      '<div class="hcard glass"><p class="kick">Proposal</p><p class="q">Require an elevator?</p>' +
      '<p class="sm">One rule. Nothing changes without a yes.</p></div>' +
      '<p class="arw">&gt;</p>' +
      '<div class="hcard glass"><p class="kick">Vladimir</p><p class="num yes">Yes</p>' +
      '<p class="ln">The shortlist re-filters.</p><span class="tag">measurement pending</span></div>' +
      '</div><p class="foot">Run on synthetic test data.</p>');
  }
  function zone(n) {
    var cls = '', body = '';
    if (n === 1) body = board(0, '<p class="foot"><b>Monthly</b> = rent 24,000 + services 3,500 CZK. Budget cap 30,000 CZK.<br><b>Move-in cost</b> = everything paid to move in: first month 27,500 + deposit 48,000 CZK. Commission not stated, so not included.</p>');
    if (n === 2) body = board(1, '<p class="foot">Vladimir moved one flat to <b>Interested</b>. Only now may the agent make contact.</p>');
    if (n === 3) { cls = 'two'; body = terminal() + phone('incoming'); }
    if (n === 4) { cls = 'two'; body = terminal() + phone('call'); }
    if (n === 5) { cls = 'book'; body = phone('result') + '<div class="stack">' + calendar() + notionBooked() + '</div>'; }
    if (n === 6) body = posthog();
    return '<div class="zone"><div class="ztop"><span class="ph-tag">PLACEHOLDER: the real app is live here on stage</span>' +
      '<span class="tag">SAMPLE DATA</span></div><div class="zbody ' + cls + '">' + body + '</div></div>';
  }

  /* ---------- full-stage states ---------- */
  function title(n) {
    return '<div class="full title">' +
      '<div class="tbrand"><div class="lcd">' + MASCOT + '<b>DOMOVOY<i class="cur"></i></b></div><span class="team">by (Not)Homeless.ai</span></div>' +
      '<p class="kick">Vladimir, renter</p>' +
      '<h1>I am looking for a flat in Prague.<span>Three portals, hidden fees, and calls during work hours.</span></h1>' +
      '<div class="pitch glass"><p class="p1">Your real-estate agent in your pocket.</p>' +
      '<p class="p2">An open-source Agent Skill for Claude Code. Approve one flat and it calls to book the viewing.</p></div>' +
      '<div class="beats"><div><b>1</b>Vladimir approves one flat</div><div><b>2</b>The agent calls and asks what the listing hides</div><div><b>3</b>A viewing lands in his calendar</div></div>' +
      '<p class="honest">' + HONESTY + '</p>' + counter(n) + '</div>';
  }
  function closeCols() {
    return ['BUILT', 'PARTLY', 'PLANNED'].map(function (kind) {
      var items = STATUS.closeOrder.filter(function (id) { return STATUS.features[id].chip === kind; })
        .slice(0, STATUS.closeMax)
        .map(function (id) { return '<li>' + STATUS.features[id].label + '</li>'; }).join('');
      return '<div class="ccol glass"><span class="chip ' + kind + '">' + STATUS.closeTitles[kind] + '</span><ul>' + items + '</ul></div>';
    }).join('');
  }
  function closing(n) {
    return '<div class="full close">' + brand() +
      '<h1>Install the skill in your own agent</h1>' +
      '<div class="links"><div class="link glass"><p class="kick">Repo</p><p class="mono">' + REPO + '</p></div>' +
      '<div class="link glass"><p class="kick">Demo</p><p class="mono">' + DEMO + '</p></div></div>' +
      '<div class="cols">' + closeCols() + '</div>' +
      '<p class="next">' + STATUS.features.business.label + featureChip('business') + '</p>' +
      '<p class="honest">' + HONESTY + '</p>' + counter(n) + '</div>';
  }

  /* ---------- state renderer: real DOM, can be called many times ---------- */
  function renderState(n, railOnly) {
    var el = document.createElement('div');
    el.className = 'stage' + (railOnly ? ' is-rail' : '');
    if (railOnly) el.innerHTML = rail(n);
    else if (n === 0) el.innerHTML = title(n);
    else if (n === LAST) el.innerHTML = closing(n);
    else el.innerHTML = zone(n) + rail(n);
    return el;
  }

  /* ---------- view, navigation, scaling ---------- */
  var root = document.getElementById('dmv-a');
  var q = new URLSearchParams(window.location.search);
  var embedded = window.DOMOVOY_VIEW !== undefined || window.DOMOVOY_STEP !== undefined;
  var isTop = false;
  try { isTop = window.self === window.top; } catch (e) { isTop = false; }

  function truthy(v) { return v === true || v === 1 || v === '1' || v === 'true'; }
  var forced = window.DOMOVOY_RAIL !== undefined ? truthy(window.DOMOVOY_RAIL) : (q.get('rail') !== null ? truthy(q.get('rail')) : (truthy(q.get('full')) ? false : null));
  function wantRail() { return forced !== null ? forced : window.innerWidth < window.innerHeight * 1.2; }
  var RAIL = wantRail();
  var viewAll = window.DOMOVOY_VIEW !== undefined ? window.DOMOVOY_VIEW === 'all' : q.get('view') === 'all';
  var first = window.DOMOVOY_STEP !== undefined ? window.DOMOVOY_STEP : q.get('step');
  var state = Math.min(LAST, Math.max(0, parseInt(first, 10) || 0));
  var W = RAIL ? 560 : 1920, H = 1080;
  function reshape() { var r = wantRail(); if (r !== RAIL) { RAIL = r; W = RAIL ? 560 : 1920; draw(); } else fit(); }

  function fitSingle() {
    var frame = root.firstChild;
    if (!frame) return;
    var s = root.clientWidth / W;
    var cap = isTop && !embedded && window.innerHeight > 0;
    if (cap) s = Math.min(s, window.innerHeight / H);
    frame.style.width = (W * s) + 'px';
    frame.style.height = (H * s) + 'px';
    frame.style.marginTop = cap ? Math.max(0, (window.innerHeight - H * s) / 2) + 'px' : '0';
    frame.firstChild.style.transform = 'scale(' + s + ')';
  }
  function fitSheet() {
    var sheet = root.firstChild;
    if (!sheet) return;
    var w = root.clientWidth, gap = 18, cols;
    if (RAIL) cols = w < 1000 ? 2 : 4;
    else cols = w < 1000 ? 1 : (w < 1800 ? 2 : 3);
    var cw = (w - gap * (cols - 1)) / cols;
    sheet.style.gridTemplateColumns = 'repeat(' + cols + ', ' + cw + 'px)';
    var thumbs = sheet.querySelectorAll('.dmv-thumb');
    for (var i = 0; i < thumbs.length; i++) {
      thumbs[i].style.height = (H * cw / W) + 'px';
      thumbs[i].firstChild.style.transform = 'scale(' + (cw / W) + ')';
    }
  }
  function fit() { if (viewAll) fitSheet(); else fitSingle(); }

  function draw() {
    root.innerHTML = '';
    if (viewAll) {
      var sheet = document.createElement('div');
      sheet.className = 'dmv-sheet';
      STATES.forEach(function (st, n) {
        var cell = document.createElement('div');
        cell.className = 'dmv-cell';
        cell.innerHTML = '<p class="dmv-cap"><b>' + n + '</b>' + st.name + '</p>';
        var thumb = document.createElement('div');
        thumb.className = 'dmv-thumb';
        thumb.appendChild(renderState(n, RAIL));
        cell.appendChild(thumb);
        cell.addEventListener('click', function () { viewAll = false; state = n; draw(); });
        sheet.appendChild(cell);
      });
      root.appendChild(sheet);
    } else {
      var frame = document.createElement('div');
      frame.className = 'dmv-frame';
      frame.appendChild(renderState(state, RAIL));
      frame.addEventListener('click', function () { go(state + 1); });
      root.appendChild(frame);
    }
    fit();
  }
  function go(n) {
    n = Math.min(LAST, Math.max(0, n));
    if (viewAll) viewAll = false;
    else if (n === state) return;
    state = n;
    draw();
  }

  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Spacebar' || e.key === 'PageDown') { e.preventDefault(); go(state + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(state - 1); }
    else if (/^[0-9]$/.test(e.key) && +e.key <= LAST) { go(+e.key); }
    else if (e.key === 'a' || e.key === 'A') { viewAll = !viewAll; draw(); }
  });
  window.addEventListener('resize', reshape);
  window.DOMOVOY_A = { renderState: renderState, go: go, STATUS: STATUS };
  draw();
})();
</script>
</body>
</html>
